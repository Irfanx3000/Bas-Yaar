# TLS settings, owned here rather than included from certbot's
# options-ssl-nginx.conf — that file is installed by the nginx *plugin*, so a
# `certonly` run can leave it missing or unparseable, and nginx then fails with
# "unexpected end of file" pointing at line 1 of a file nobody wrote.
#
# Mozilla "intermediate" profile: TLS 1.2 + 1.3 only, forward secrecy
# throughout. No DHE ciphers, which is why there is no ssl_dhparam — generating
# a 2048-bit dhparam takes a minute and buys nothing when every cipher here is
# ECDHE.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_session_cache shared:CrewApplySSL:10m;
ssl_session_timeout 1d;
# Off by default in nginx, and left off: tickets without rotation weaken forward
# secrecy, and rotation needs key management this deployment does not have.
ssl_session_tickets off;

# NO OCSP STAPLING. Let's Encrypt removed the OCSP responder URL from its
# certificates when it retired OCSP in favour of CRLs, so nginx logs
# `"ssl_stapling" ignored, no OCSP responder URL in the certificate` on every
# config test and staples nothing. The directives are dead weight against an
# ACME certificate — and the `resolver` they require is one more thing to get
# wrong. Re-add both together if a CA that still publishes OCSP is ever used.
