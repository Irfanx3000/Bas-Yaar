# nginx site for crewapply.com — the Next.js app on 127.0.0.1:3000.
#
# Install:
#   cp deploy/nginx/crewapply.com.conf /etc/nginx/sites-available/crewapply.com
#   ln -s /etc/nginx/sites-available/crewapply.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# TLS settings live in snippets/crewapply-tls.conf next to this file, NOT in
# certbot's /etc/letsencrypt/options-ssl-nginx.conf. That file only exists if
# certbot's nginx plugin has run its installer; with `certonly` it may be absent
# or a stub, and nginx then fails to parse at line 1 with an error that says
# nothing about the real cause. Owning the settings removes the dependency.
#
# ⚠️ Put this in place BEFORE running certbot. The TLS block below refers to
# certificate files that do not exist yet, so `nginx -t` fails until certbot has
# issued them. The order in DEPLOY.md handles this: install the port-80 block
# first, let certbot obtain the certificate and write its own TLS lines, then
# compare against this file. Nothing here fights certbot — the paths are exactly
# the ones it uses.

# HTTP → HTTPS, and the ACME challenge, which must stay on port 80 and must not
# be redirected or renewals break.
server {
    listen 80;
    listen [::]:80;
    server_name crewapply.com www.crewapply.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# www → apex, as its own server block rather than an `if` inside the main one.
# Keeping the redirect separate means the canonical host has exactly one
# configuration and no request to it is evaluated against a rewrite rule.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.crewapply.com;

    ssl_certificate     /etc/letsencrypt/live/crewapply.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crewapply.com/privkey.pem;
    include /etc/nginx/snippets/crewapply-tls.conf;

    return 301 https://crewapply.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name crewapply.com;

    ssl_certificate     /etc/letsencrypt/live/crewapply.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crewapply.com/privkey.pem;
    include /etc/nginx/snippets/crewapply-tls.conf;

    # HSTS is deliberately NOT set here. api.crewapply.com already sends it, and
    # adding includeSubDomains from the apex would commit every current and
    # future subdomain to HTTPS-only — a hard thing to undo, since browsers cache
    # it for the full max-age. Turn it on once you are sure that is what you want.

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # No CSP header here. The app inlines styles and Next injects inline scripts
    # for hydration, so a naive policy would break the site on the first load.
    # Worth adding later, with report-only first.

    access_log /var/log/nginx/crewapply.com.access.log;
    error_log  /var/log/nginx/crewapply.com.error.log;

    # gzip for the text Next serves. Not brotli — that needs a module that is not
    # in the stock Debian/Ubuntu nginx, and gzip is most of the win.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml font/woff2;

    # File uploads go straight to api.crewapply.com, not through this server, so
    # this only has to cover normal form posts. Kept modest on purpose.
    client_max_body_size 2m;

    # Hashed build assets — immutable by construction, so they can be cached hard
    # and never revalidated. This is the single biggest repeat-visit win and the
    # reason for a separate location block.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # next/image output. Cacheable, but NOT immutable — the same URL serves a new
    # image if the source changes.
    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 60m;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # $host, not $http_host — Next builds absolute URLs (metadata, redirects)
        # from what it is told it is serving, and getting this wrong sends users
        # to 127.0.0.1.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Without this Next believes it is on plain HTTP behind the proxy and can
        # emit http:// redirects, which then bounce back through the 301 above.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Upgrade headers are here for Next's dev HMR websocket. `next start`
        # does not use one, so this is inert in production and simply means a
        # future websocket needs no config change.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $http_upgrade;

        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
